<style>

        margin: 0;

</head>

<body>

<div class="login-container">

```
<div class="logo">Lab Mate</div>

<p class="subtitle">
    Welcome back!
</p>

<form id="loginForm">

    <div class="form-group">

        <label for="username">
            Username or Email
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username or email"
            required
        >

    </div>


    <div class="form-group">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

    </div>


    <button
        type="submit"
        class="login-btn"
        id="loginButton"
    >
        Login
    </button>


    <div
        id="message"
        class="message"
    ></div>

</form>


<p class="signup-text">

    Don't have an account?

    <a href="/signup">
        Create Account
    </a>

</p>
```

</div>

<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;


        const message =
            document.getElementById("message");

        const button =
            document.getElementById("loginButton");


        button.disabled = true;

        button.textContent = "Logging in...";


        try {

            const response = await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (response.ok) {

                message.textContent =
                    "Login successful!";

                message.style.color = "green";


                setTimeout(function() {

                    window.location.href = "/";

                }, 700);

            }

            else {

                message.textContent =
                    data.error || "Login failed.";

                message.style.color = "red";

                button.disabled = false;

                button.textContent = "Login";
            }

        }

        catch (error) {

            message.textContent =
                "Could not connect to server.";

            message.style.color = "red";

            button.disabled = false;

            button.textContent = "Login";
        }

    });

</script>

</body>
</html>
