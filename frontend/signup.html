<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Mate - Sign Up</title>

```
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f7fb;
        padding: 20px;
    }

    .signup-container {
        width: 100%;
        max-width: 450px;
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    .logo {
        text-align: center;
        margin-bottom: 10px;
        font-size: 32px;
        font-weight: bold;
        color: #2563eb;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
    }

    input:focus {
        border-color: #2563eb;
    }

    .signup-btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .signup-btn:hover {
        background: #1d4ed8;
    }

    .signup-btn:disabled {
        background: #93c5fd;
        cursor: not-allowed;
    }

    .message {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
        font-weight: bold;
    }

    .login-text {
        text-align: center;
        margin-top: 22px;
        color: #666;
    }

    .login-text a {
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
    }

    .password-note {
        font-size: 12px;
        color: #777;
        margin-top: 6px;
    }
</style>
```

</head>

<body>

<div class="signup-container">

```
<div class="logo">Lab Mate</div>

<p class="subtitle">
    Create your student account
</p>

<form id="signupForm">

    <div class="form-group">
        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >
    </div>

    <div class="form-group">
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            placeholder="Choose a username"
            required
        >
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >
    </div>

    <div class="form-group">
        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
        >

        <p class="password-note">
            Password must contain at least 6 characters.
        </p>
    </div>

    <div class="form-group">
        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter your password"
            required
        >
    </div>

    <button
        type="submit"
        class="signup-btn"
        id="signupButton"
    >
        Create Account
    </button>

    <div
        id="message"
        class="message"
    ></div>

</form>

<p class="login-text">
    Already have an account?
    <a href="/login">Login</a>
</p>
```

</div>

<script>

document
    .getElementById("signupForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const username =
            document.getElementById("username").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("signupButton");


        // Check passwords

        if (password !== confirmPassword) {

            message.textContent =
                "Passwords do not match!";

            message.style.color = "red";

            return;
        }


        button.disabled = true;

        button.textContent = "Creating Account...";


        try {

            const response = await fetch(
                "/api/signup",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        username: username,
                        email: email,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (response.ok) {

                message.textContent =
                    "Account created successfully!";

                message.style.color = "green";


                setTimeout(function() {

                    window.location.href = "/login";

                }, 1000);

            }

            else {

                message.textContent =
                    data.error || "Signup failed.";

                message.style.color = "red";

                button.disabled = false;

                button.textContent =
                    "Create Account";
            }

        }

        catch (error) {

            message.textContent =
                "Could not connect to server.";

            message.style.color = "red";

            button.disabled = false;

            button.textContent =
                "Create Account";
        }

    });

</script>

</body>
</html>
